name: Live Schema 3.0.2

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-schema-3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GLCDP_RUN_LIVE_TESTS: "true"
      NOT_CRAN: "true"
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            local::.
          needs: check

      - name: Run the live Schema 3.0.2 integration test
        run: |
          library(glcdp)
          testthat::test_file(
            "tests/testthat/test-live.R",
            reporter = "summary",
            stop_on_failure = TRUE
          )
        shell: Rscript {0}
